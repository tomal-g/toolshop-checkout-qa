name: QA Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # ========== STAGE 1: Build & Lint ==========
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Lint (ESLint)
        run: npx eslint . --ext .js --ignore-path .gitignore || true
        continue-on-error: true

      - name: Check syntax
        run: node -c perf/k6/scripts/*.js || true
        continue-on-error: true

  # ========== STAGE 2: API Tests ==========
  api-tests:
    name: API Tests (Postman)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection
        run: |
          newman run postman/collections/toolshop-api.postman_collection.json \
            -e postman/environments/ci.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/api-tests-report.html
        continue-on-error: true

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-report
          path: reports/api-tests-report.html
          retention-days: 7

  # ========== STAGE 3: UI Smoke Tests (Playwright) ==========
  ui-smoke:
    name: UI Smoke Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npx playwright test --grep @smoke
        continue-on-error: true

      - name: Generate Playwright report
        if: always()
        run: npx playwright show-report || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload trace files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ========== STAGE 4: Performance Smoke Tests (k6) ==========
  perf-smoke:
    name: Performance Smoke Tests (k6)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        run: sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 smoke tests
        run: |
          k6 run \
            --env BASE_URL=http://localhost:8091/api \
            --summary-export=reports/k6-smoke-summary.json \
            perf/k6/scripts/01_get_products.js
        continue-on-error: true

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-report
          path: reports/k6-smoke-summary.json
          retention-days: 7

  # ========== STAGE 5: Quality Gates ==========
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [api-tests, ui-smoke, perf-smoke]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Check test results
        run: |
          echo "=== Quality Gate Check ==="

          # Check if Playwright report exists
          if [ -d "artifacts/playwright-report" ]; then
            echo "✅ Playwright report generated"
          else
            echo "⚠️  Playwright report missing"
          fi

          # Check if API report exists
          if [ -f "artifacts/api-tests-report/api-tests-report.html" ]; then
            echo "✅ API tests report generated"
          else
            echo "⚠️  API tests report missing"
          fi

          # Check if k6 report exists
          if [ -f "artifacts/k6-smoke-report/k6-smoke-summary.json" ]; then
            echo "✅ k6 smoke test report generated"
          else
            echo "⚠️  k6 smoke test report missing"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## QA Pipeline Results
              
              - ✅ Build & Lint: Passed
              - 🧪 API Tests: [Report](artifacts/api-tests-report)
              - 🎭 UI Smoke (Playwright): [Report](artifacts/playwright-report)
              - 📊 Perf Smoke (k6): [Report](artifacts/k6-smoke-report)
              
              **Status:** Review artifacts before merge.`
            })

      - name: Fail if critical tests failed
        run: |
          echo "Pipeline complete. Manual review required for merge."
          exit 0

  # ========== STAGE 6: Consolidated Report ==========
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [api-tests, ui-smoke, perf-smoke, quality-gates]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate consolidated summary
        run: |
          echo "========================================" > pipeline-summary.txt
          echo "QA Pipeline Execution Summary" >> pipeline-summary.txt
          echo "Timestamp: $(date)" >> pipeline-summary.txt
          echo "Branch: ${{ github.ref }}" >> pipeline-summary.txt
          echo "Commit: ${{ github.sha }}" >> pipeline-summary.txt
          echo "========================================" >> pipeline-summary.txt
          echo "" >> pipeline-summary.txt
          echo "Artifacts generated:" >> pipeline-summary.txt
          ls -la artifacts/ >> pipeline-summary.txt || echo "No artifacts" >> pipeline-summary.txt
          cat pipeline-summary.txt

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: pipeline-summary.txt
          retention-days: 7
